<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Музыка | МатМех</title>
    <link rel="stylesheet" href="style_visit_cards.css">
</head>
<body>
    <header class="header">

        <div class="logo">
            <img src="logo.png" alt="Логотип">
        </div>

        <nav>
            <a class="home-button" href="index.html">Вернуться на главную</a>
        </nav>

    </header>

    <main>
        <section class="hero">
            <div class="hero-text">
                <h1 class="fade-in">Музыка</h1>

                <p class="fade-in delay-1">
                    Здесь вы можете найти аудиозаписи и плейлисты групп матмеха
                </p>

                <p class="fade-in delay-2">
                    Нажмите на изображение ниже, чтобы перейти

                </p>
            </div>
        </section>

        <section class="groups-section">
            <h2>Выберите группу</h2>

            <div class="groups-list">

                <article class="group-card">
                    <a href="group1_music.html">
                        <img src="тату_кота1.jpg" alt="первая" width="250">
                    </a>
                    <h3>тату кота</h3>
                </article>

                <article class="group-card">
                    <a href="group2_music.html">
                        <img src="Рухнум1.jpg" alt="вторая" width="250">
                    </a>
                    <h3>Рухнум</h3>
                </article>

                <article class="group-card">
                    <a href="group3_music.html">
                        <img src="ascii-dog1.jpg" alt="третья" width="250">
                    </a>
                    <h3>ascii-dog</h3>
                </article>

            </div>
        </section>
    </main>

    <footer class="footer">
        <p>МатМех2026</p>
    </footer>
    <script src="script.js"></script>
</body>
</html>
