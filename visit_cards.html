<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Музыкальные группы</title>
    <link rel="stylesheet" href="style_visit_cards.css">
</head>
<body>
    <!--Верхняя часть страницы-->
    <header class="header">

        <!--Логотип-->
        <div class="logo">
            <img src="logo.png" alt="Логотип">
        </div>

        <!--Кнопка возврата на главную-->
        <nav>
            <a class="home-button" href="index.html">Вернуться на главную</a>
        </nav>

    </header>
    <!--Основная часть страницы-->
    <main>
        <!--Первый большой блок с фоном, описанием и заголовком-->
        <section class="hero">
            <div class="hero-text">
                <h1 class="fade-in">Музыкальные группы</h1>

                <p class="fade-in delay-1">
                    Здесь вы можете найти визитки групп
                </p>

                <p class="fade-in delay-2">
                    Нажмите на изображение ниже, чтобы перейти
                    на отдельную страницу с подробной информацией
                </p>
            </div>
        </section>

        <!--Блок с группами-->
        <section class="groups-section">
            <h2>Выберите группу</h2>

            <div class="groups-list">

            <!--Первая группа-->

                <article class="group-card">
                    <a href="group1.html">
                        <img src="тату_кота1.jpg" alt=Первая группа" width="250">
                    </a>                   
                    <h3>тату кота</h3>
                </article>

            <!--Вторая группа-->

                <article class="group-card">
                    <a href="group2.html">
                        <img src="Рухнум1.jpg" alt="Вторая группа" width="250">
                    </a>
                    <h3>Рухнум</h3>
                </article>

            <!--Третья группа-->

                <article class="group-card">
                    <a href="group3.html">
                        <img src="ascii-dog1.jpg" alt="Третья группа" width="250">
                     </a>
                    <h3>ascii-dog</h3>
                </article>

                </div>
        </section>
    </main>

    <!--Нижняя часть страницы-->
    <footer class="footer">
        <p>МатМех2026</p>
    </footer>
</body>
</html>
